name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        metabase-version:
          - "0.59.6.3"
          - "0.60.1"
          - "0.60.2.2"
    env:
      METABASE_TEST_VERSION: ${{ matrix.metabase-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.11.1.1435

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
            .cache/test-deps
          key: ${{ runner.os }}-clojure-${{ matrix.metabase-version }}-${{ hashFiles('**/deps.edn', 'scripts/run-unit-tests.sh') }}
          restore-keys: |
            ${{ runner.os }}-clojure-${{ matrix.metabase-version }}-

      - name: Build source-only driver JAR
        run: clojure -T:build jar

      - name: Check generated artifact
        run: |
          test -f target/doris.metabase-driver.jar
          jar tf target/doris.metabase-driver.jar | grep -q 'metabase-plugin.yaml'
          jar tf target/doris.metabase-driver.jar | grep -q 'metabase/driver/doris.clj'

      - name: Run unit tests against Metabase ${{ matrix.metabase-version }}
        run: bash scripts/run-unit-tests.sh

      - name: Validate shell scripts
        run: |
          bash -n run-local-metabase.sh
          bash -n scripts/run-unit-tests.sh
          bash -n scripts/validate-local.sh
          bash -n scripts/validate-external-catalog.sh

      - name: Validate YAML manifests
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              Path("resources/metabase-plugin.yaml"),
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release.yml"),
          ]

          for path in files:
              with path.open() as fh:
                  yaml.safe_load(fh)
          PY
