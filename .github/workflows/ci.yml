name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Build source-only driver JAR
        run: clojure -T:build jar

      - name: Check generated artifact
        run: |
          test -f target/doris.metabase-driver.jar
          jar tf target/doris.metabase-driver.jar | grep -q 'metabase-plugin.yaml'
          jar tf target/doris.metabase-driver.jar | grep -q 'metabase/driver/doris.clj'

      - name: Validate shell scripts
        run: |
          bash -n run-local-metabase.sh
          bash -n scripts/validate-local.sh
          bash -n scripts/validate-external-catalog.sh

      - name: Validate YAML manifests
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              Path("resources/metabase-plugin.yaml"),
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release.yml"),
          ]

          for path in files:
              with path.open() as fh:
                  yaml.safe_load(fh)
          PY
